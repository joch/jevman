name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: docker build --build-arg "SOURCE_COMMIT=$GITHUB_SHA" --tag jevman:ci .
      - run: python3 scripts/smoke-image.py jevman:ci
      # Only a green push to main deploys, and it deploys exactly this commit.
      - name: Deploy tested commit and verify readiness
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.COOLIFY_APP_UUID != ''
        run: python3 scripts/deploy.py
        env:
          COOLIFY_WEBHOOK_URL: ${{ vars.COOLIFY_WEBHOOK_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          APP_URL: ${{ vars.APP_URL }}
          COOLIFY_WEBHOOK_SECRET: ${{ secrets.COOLIFY_WEBHOOK_SECRET }}
  publish-dokploy:
    needs: test-and-deploy
    if: github.repository == 'joch/jevman' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOKPLOY_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and smoke the exact release image
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --provenance=false \
            --build-arg "SOURCE_COMMIT=$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/joch/jevman" \
            --tag jevman:release .
          image_id=$(docker image inspect --format '{{.Id}}' jevman:release)
          python3 scripts/smoke-image.py "$image_id"
          printf '%s\n' "$image_id" > "$RUNNER_TEMP/jevman-release.image"
      - name: Publish the smoke-tested image to private GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-image.sh "$RUNNER_TEMP/jevman-release.image"
