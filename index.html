<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jevman</title>
  </head>
  <body>
    <main class="layout">
      <section class="game">
        <header class="hud">
          <span>Score <b id="score">0</b></span>
          <span>Level <b id="level">1</b></span>
          <span>Lives <b id="lives">3</b></span>
          <span>Fruit <b id="fruit-hud"></b></span>
        </header>
        <canvas id="game" aria-label="Pac-Man game board"></canvas>
        <div class="controls">
          <button id="toggle-pacman" aria-pressed="true">Pac-Man: jev</button>
          <label>Speed <input id="speed" type="range" min="0.25" max="1" step="0.05" value="1" /> <output id="speed-out">1.00×</output></label>
          <button id="pause">Pause</button>
          <button id="restart">Restart</button>
        </div>
        <p class="help">Arrows/WASD steer in keyboard mode · J toggle Pac-Man · P pause · R restart</p>
      </section>
      <aside id="panel" aria-label="jev decisions"></aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
