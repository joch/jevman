<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>jevman</title>
  </head>
  <body>
    <div class="page">
    <header class="site">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <div>
          <h1>jevman</h1>
          <p>Pac-Man played by jev, Opper's decision model</p>
        </div>
      </div>
      <div id="account" class="account" aria-live="polite"></div>
    </header>
    <main class="layout">
      <section class="game">
        <header class="hud">
          <span>Score <b id="score">0</b></span>
          <span>Level <b id="level">1</b></span>
          <span>Lives <b id="lives">3</b></span>
          <span>Fruit <b id="fruit-hud"></b></span>
        </header>
        <div class="board">
          <canvas id="game" aria-label="Pac-Man game board"></canvas>
          <div id="overlay" class="overlay" role="dialog" aria-modal="false" hidden></div>
        </div>
        <div class="controls">
          <button id="toggle-pacman" aria-pressed="true">Pac-Man: jev</button>
          <label>Speed <input id="speed" type="range" min="0.25" max="1" step="0.05" value="1" /> <output id="speed-out">1.00×</output></label>
          <button id="pause">Pause</button>
          <button id="restart">Restart</button>
        </div>
        <p class="help">Arrows/WASD steer in keyboard mode · J toggle Pac-Man · P pause · R restart</p>
        <p class="source"><a href="https://github.com/joch/jevman" target="_blank" rel="noopener">Source on GitHub ↗</a></p>
      </section>
      <aside id="panel" aria-label="jev decisions"></aside>
    </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
