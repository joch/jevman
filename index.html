<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>jevman · Can you beat the AI at Pac-Man?</title>
    <meta name="description" content="Watch five AI decision models play Pac-Man, steer Pac-Man yourself, and see where you rank." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="jevman" />
    <meta property="og:title" content="Can you beat the AI at Pac-Man?" />
    <meta property="og:description" content="Watch five AI decision models play Pac-Man, steer Pac-Man yourself, and see where you rank." />
    <meta property="og:url" content="https://jevman.apps.chadda.se/" />
    <meta property="og:image" content="https://jevman.apps.chadda.se/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Can you beat the AI at Pac-Man?" />
    <meta name="twitter:description" content="Watch five AI decision models play Pac-Man, steer Pac-Man yourself, and see where you rank." />
    <meta name="twitter:image" content="https://jevman.apps.chadda.se/og.png" />
  </head>
  <body>
    <div class="page">
    <header class="site">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <div>
          <h1>jevman</h1>
          <p>Pac-Man played by AI decision models</p>
        </div>
      </div>
      <nav class="site-nav" aria-label="Site"><a href="/leaderboard">🏆 Leaderboard</a></nav>
      <div id="account" class="account" aria-live="polite"></div>
    </header>
    <main class="layout">
      <section class="game">
        <header class="hud">
          <span>Score <b id="score">0</b></span>
          <span>Level <b id="level">1</b></span>
          <span>Lives <b id="lives">3</b></span>
          <span>Fruit <b id="fruit-hud"></b></span>
        </header>
        <div class="board">
          <canvas id="game" aria-label="Pac-Man game board"></canvas>
          <div id="overlay" class="overlay" role="dialog" aria-modal="false" hidden></div>
          <button id="play-cta" class="play-cta" type="button" hidden>▶ Play</button>
        </div>
        <div class="dpad" id="dpad" hidden aria-label="Steer Pac-Man">
          <button type="button" data-dir="up" aria-label="Up">▲</button>
          <button type="button" data-dir="left" aria-label="Left">◀</button>
          <button type="button" data-dir="down" aria-label="Down">▼</button>
          <button type="button" data-dir="right" aria-label="Right">▶</button>
        </div>
        <div class="controls">
          <button id="toggle-pacman" aria-pressed="true">Pac-Man: AI</button>
          <label>Speed <input id="speed" type="range" min="0.25" max="1" step="0.05" value="1" /> <output id="speed-out">1.00×</output></label>
          <button id="pause">Pause</button>
          <button id="restart">Restart</button>
          <button id="mute" aria-pressed="false" aria-label="Sound">🔊</button>
        </div>
        <p class="help">Arrows/WASD or swipe steer when you play Pac-Man · J switch sides · P pause · R restart</p>
        <p class="source"><a href="/leaderboard">Which AI plays best? Leaderboard</a> · <a href="https://github.com/joch/jevman" target="_blank" rel="noopener">Source on GitHub ↗</a></p>
      </section>
      <aside id="panel" aria-label="Decisions"></aside>
    </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
